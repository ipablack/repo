          import base64
          import io
          import json
          import os
          from pathlib import Path
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import urlopen
          from zipfile import ZipFile
          
          LEGACY = 'https://raw.githubusercontent.com/ipablack/repo/refs/heads/main/'
          CATALOG_LIMIT = 32 * 1024 * 1024
          CONFIG_LIMIT = 512 * 1024
          CONFIG_KEYS = (
              'name', 'identifier', 'subtitle', 'description', 'iconURL', 'tintColor',
              'repo_revision_id', 'xsign_config', 'categories',
          )
          WORKER_REQUIRED = (
              'CLOUDFLARE_WORKER/wrangler.toml', 'CLOUDFLARE_WORKER/worker.mjs',
              'CLOUDFLARE_WORKER/make_device_access.py', 'Tools/sync_protected_source.py',
              'repo.example.json',
          )
          WRANGLER = 'CLOUDFLARE_WORKER/wrangler.toml'
          
          
          def read_public_json(name, limit):
              with urlopen(LEGACY + name, timeout=15) as response:
                  if response.geturl() != LEGACY + name:
                      raise ValueError('Unexpected repository redirect.')
                  raw = response.read(limit + 1)
              return parse_document(raw, limit)
          
          
          def parse_document(raw, limit):
              if len(raw) > limit:
                  raise ValueError('Catalogue file exceeds the size limit.')
              data = json.loads(raw.decode('utf-8-sig'))
              if not isinstance(data, dict):
                  raise ValueError('Expected a catalogue object.')
              return data
          
          
          def as_json(data, limit):
              raw = (json.dumps(data, ensure_ascii=False, indent=2) + '\n').encode()
              if len(raw) > limit:
                  raise ValueError('Formatted catalogue file exceeds the size limit.')
              return raw
          
          
          def catalogue_seed(paths):
              if paths['xsign-config.json'].exists():
                  print('Existing xsign-config.json kept. No catalogue migration performed.')
                  return {}
              if paths['repo.json'].exists():
                  print('Existing private repo.json kept. Using it for the configuration.')
                  catalogue = parse_document(paths['repo.json'].read_bytes(), CATALOG_LIMIT)
              elif os.environ['XSIGN_IMPORT_LEGACY'].lower() == 'true':
                  print('Reading catalogue metadata from ipablack/repo.')
                  catalogue = read_public_json('repo.json', CATALOG_LIMIT)
                  try:
                      projection = read_public_json('xsign-config.json', CONFIG_LIMIT)
                  except HTTPError as error:
                      if error.code != 404:
                          raise
                  else:
                      revision = projection.get('repo_revision_id')
                      catalog_revision = catalogue.get('repo_revision_id', 0)
                      if type(revision) is int and (type(catalog_revision) is not int or revision >= catalog_revision):
                          catalogue.update({key: projection[key] for key in CONFIG_KEYS if key in projection})
              else:
                  print('Catalogue import disabled. Publish the initial catalogue from Studio.')
                  return {}
              if not isinstance(catalogue.get('apps'), list):
                  raise ValueError('Expected an app list in repo.json.')
              if not isinstance(catalogue.get('xsign_config'), dict):
                  raise ValueError('No XSign configuration found. Publish from Studio.')
              revision = catalogue.get('repo_revision_id')
              if type(revision) is not int or revision < 1:
                  catalogue['repo_revision_id'] = 1
              config = {key: catalogue[key] for key in CONFIG_KEYS if key in catalogue}
              result = {'xsign-config.json': as_json(config, CONFIG_LIMIT)}
              if not paths['repo.json'].exists():
                  result['repo.json'] = as_json(catalogue, CATALOG_LIMIT)
              return result
          
          
          def validate_path(name):
              path = Path(name)
              for component in (path, *path.parents):
                  if component.is_symlink():
                      raise SystemExit('A setup destination is a symbolic link: ' + name)
              if path.exists() and not path.is_file():
                  raise SystemExit('A setup destination is not a file: ' + name)
              return path
          
          
          files = {}
          with ZipFile(io.BytesIO(base64.b64decode(EMBEDDED))) as archive:
              for name in WORKER_REQUIRED:
                  files[name] = archive.read(name)
          
          provided_origin = os.environ['XSIGN_WORKER_ORIGIN'].strip()
          if provided_origin:
              url = urlsplit(provided_origin)
              host = url.hostname or ''
              if (url.scheme != 'https' or url.path not in ('', '/') or url.query or url.fragment
                      or url.netloc.lower() != host
                      or not re.fullmatch(r'(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}', host)):
                  raise SystemExit('Enter the HTTPS Worker origin without a path, port or credentials.')
              origin = 'https://' + host
              files[WRANGLER] = files[WRANGLER].replace(
                  b'https://xsign-protected-catalog.REPLACE-ME.workers.dev', origin.encode())
              if not host.endswith('.workers.dev'):
                  files[WRANGLER] = files[WRANGLER].replace(b'workers_dev = true', b'workers_dev = false')
          
          paths = {name: validate_path(name) for name in (*files, 'repo.json', 'xsign-config.json')}
          catalogue_warning = ''
          try:
              files.update(catalogue_seed(paths))
          except (OSError, URLError, ValueError, TimeoutError) as error:
              catalogue_warning = (
                  'Setup files were prepared, but the catalogue was not imported (' + type(error).__name__ +
                  '). Verify ipablack/repo/main/repo.json or import and publish it through Studio.'
              )
          
          for name, data in files.items():
              path = paths[name]
              if path.exists():
                  print('Kept ' + name)
                  continue
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('xb') as output:
                  output.write(data)
              print('Added ' + name)
          
          if catalogue_warning:
              print('::warning::' + catalogue_warning)
          print('Catalogue migration copies JSON only. Existing public files and release assets are untouched.')
          PYTHON
          git add -- CLOUDFLARE_WORKER/wrangler.toml CLOUDFLARE_WORKER/worker.mjs CLOUDFLARE_WORKER/make_device_access.py Tools/sync_protected_source.py repo.example.json
          for path in repo.json xsign-config.json; do
            if [[ -f "$path" ]]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "The private repository already has these files."
            exit 0
          fi
          git -c user.name=xsign-setup -c user.email=xsign-setup@users.noreply.github.com commit -m "Prepare private XSign catalogue"
          git push origin HEAD:main

  sync-source:
    if: ${{ github.repository == 'ipablack/XSIGN' && github.event.repository.private && github.ref == 'refs/heads/main' && inputs.source_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: xsign-source-sync-${{ inputs.source_id }}
      cancel-in-progress: false
    env:
      XSIGN_SOURCE_ID: ${{ inputs.source_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Sync one published source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$XSIGN_SOURCE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$ ]]; then
            echo "::error::Invalid published source identifier."
            exit 1
          fi
          if [[ ! -f Tools/sync_protected_source.py ]]; then
            echo "::error::Run XSign — Prepare private repository with source_id blank first."
            exit 1
          fi
          output="sources/$XSIGN_SOURCE_ID.json"
          if [[ -L sources || -L "$output" ]]; then
            echo "::error::The source output cannot be a symbolic link."
            exit 1
          fi
          python3 Tools/sync_protected_source.py --source-id "$XSIGN_SOURCE_ID" --repository "$GITHUB_REPOSITORY"
          git add -- "$output"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=xsign-source-sync -c user.email=xsign-source-sync@users.noreply.github.com commit -m "Sync private XSign source"
          git push origin HEAD:main
