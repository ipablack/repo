# Repository: ipablack/XSIGN (private)
# Path: .github/workflows/xsign-source-sync.yml
name: XSign — Prepare private repository

'on':
  workflow_dispatch:
    inputs:
      import_existing_catalog:
        description: Copy catalogue metadata from ipablack/repo if missing
        type: boolean
        default: true
      worker_origin:
        description: Exact HTTPS Worker origin (leave blank if not created yet)
        type: string
        required: false
      source_id:
        description: Only for Studio to synchronize an already published source
        type: string
        required: false

permissions: {}

jobs:
  prepare:
    if: ${{ github.repository == 'ipablack/XSIGN' && github.event.repository.private && github.ref == 'refs/heads/main' && inputs.source_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: xsign-prepare-private-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Prepare missing files and import the catalogue
        shell: bash
        env:
          XSIGN_IMPORT_LEGACY: ${{ inputs.import_existing_catalog }}
          XSIGN_WORKER_ORIGIN: ${{ inputs.worker_origin }}
