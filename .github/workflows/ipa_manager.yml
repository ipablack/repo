# Install this single file as .github/workflows/ipa_manager.yml in the source repository.
name: IPA BLACK — Extract IPA and Publish Releases
permissions:
  contents: write
concurrency:
  group: ipa-black-publisher-${{ github.ref }}
  cancel-in-progress: false
env:
  XSIGN_STUDIO_UPLOAD_SCHEMA: sidecar-v1
jobs:
  publish:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout exact queued commit
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Extract IPA, publish assets and update catalogue
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_BRANCH: ${{ github.ref_name }}
        INPUTS_JSON: ${{ toJSON(inputs) }}
        XSIGN_IPA_ENGINE_B64: 
      shell: bash
      run: |
        set -euo pipefail
        command -v gh >/dev/null
        python3 - <<'XSIGN_IPA_ENGINE'
        import base64,os,zlib
        source=zlib.decompress(base64.b64decode(os.environ['XSIGN_IPA_ENGINE_B64']))
        exec(compile(source,'xsign-ipa-publisher','exec'))
        XSIGN_IPA_ENGINE
'on':
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        type: choice
        options:
        - publish
        default: publish
      ipa_url:
        description: HTTPS IPA URL; leave empty to process files in uploads/
        type: string
        required: false
      custom_name:
        description: Optional display name; Bundle ID is always read from IPA
        type: string
      custom_desc:
        description: Optional description
        type: string
      custom_icon:
        description: Optional HTTPS PNG, JPEG or WebP icon URL
        type: string
      category_id:
        description: Existing category id in repo.json
        type: string
      skip_appstore:
        description: Do not use App Store metadata
        type: boolean
        default: true
  push:
    paths:
    - uploads/**
