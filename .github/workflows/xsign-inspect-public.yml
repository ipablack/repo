name: XSign — Inspect public update IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Public IPA link from an IPA BLACK XSign release
        required: true
        type: string
      request_id:
        description: Studio inspection request ID
        required: true
        type: string
      bundle_id:
        description: Expected bundle identifier
        required: true
        type: string
      build_request_id:
        description: Expected Studio build ID when an exact build was requested
        required: false
        type: string

permissions:
  contents: write

jobs:
  inspect:
    if: github.repository == 'ipablack/repo' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect the exact release asset
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_URL: ${{ inputs.ipa_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          BUILD_REQUEST_ID: ${{ inputs.build_request_id }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import subprocess
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile

          REPO = "ipablack/repo"
          HEADERS = {b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf", b"\xca\xfe\xba\xbe",
                     b"\xbe\xba\xfe\xca", b"\xca\xfe\xba\xbf", b"\xbf\xba\xfe\xca"}

          def gh(*args, data=None):
              return subprocess.run(["gh", *args], input=data, text=True,
                                    capture_output=True, check=True, timeout=480).stdout

          def inspect(path, bundle, expected_build):
              with ZipFile(path) as archive:
                  main = [item for item in archive.infolist()
                          if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", item.filename)]
                  if len(main) != 1 or main[0].file_size > 1024 * 1024:
                      raise ValueError("تعذّر تحديد بيانات التطبيق الرئيسي داخل IPA.")
                  info = plistlib.loads(archive.read(main[0]))
                  if not isinstance(info, dict) or info.get("XSignStudioRelease") is not True:
                      raise ValueError("الملف يحتاج إصدار XSign الناتج من Studio.")
                  application = main[0].filename.removesuffix("Info.plist")
                  executable = info.get("CFBundleExecutable")
                  if not isinstance(executable, str) or not executable or "/" in executable or "\\" in executable:
                      raise ValueError("ملف XSign التنفيذي غير صالح.")
                  binary = archive.getinfo(application + executable)
                  with archive.open(binary) as stream:
                      if binary.file_size < 4096 or stream.read(4) not in HEADERS:
                          raise ValueError("ملف XSign التنفيذي غير صالح.")
              actual_bundle = info.get("CFBundleIdentifier")
              actual_build = info.get("XSignStudioBuildRequest") or ""
              if not isinstance(actual_bundle, str) or actual_bundle.lower() != bundle.lower():
                  raise ValueError("البندل داخل IPA يختلف عن البندل المحدد في Studio.")
              if not isinstance(actual_build, str) or (actual_build and not re.fullmatch(r"[a-f0-9]{32}", actual_build)):
                  raise ValueError("معرّف بناء XSign غير صالح.")
              if expected_build and actual_build != expected_build:
                  raise ValueError("ملف IPA لا يطابق طلب البناء المحدد في Studio.")
              return {
                  "isXSign": True,
                  "appName": info.get("CFBundleDisplayName") or info.get("CFBundleName") or actual_bundle,
                  "bundleIdentifier": actual_bundle,
                  "version": info.get("CFBundleShortVersionString"),
                  "buildVersion": info.get("CFBundleVersion"),
                  "buildRequestID": actual_build,
              }

          link, request, bundle, build = (os.environ[key] for key in
              ("IPA_URL", "REQUEST_ID", "BUNDLE_ID", "BUILD_REQUEST_ID"))
          if not re.fullmatch(r"[a-f0-9]{32}", request):
              raise SystemExit("Invalid inspection request ID.")

          report = {"requestID": request, "requestDigest": hashlib.sha256(link.encode()).hexdigest()}
          try:
              match = re.fullmatch(r"https://github\.com/ipablack/(repo|x-sign|xsign)/releases/download/"
                                   r"([A-Za-z0-9][A-Za-z0-9._-]{0,127})/"
                                   r"([A-Za-z0-9][A-Za-z0-9._-]{0,180}\.ipa)", link, re.I)
              if not match:
                  raise ValueError("استخدم رابط IPA من Releases في أحد مستودعات XSign العامة التابعة لحساب ipablack.")
              if not re.fullmatch(r"[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*", bundle) or len(bundle) > 155:
                  raise ValueError("البندل المحدد في Studio غير صالح.")
              if build and not re.fullmatch(r"[a-f0-9]{32}", build):
                  raise ValueError("معرّف طلب بناء Studio غير صالح.")
              repository, tag, filename = match.groups()
              release = json.loads(gh("api", f"repos/ipablack/{repository}/releases/tags/{tag}"))
              asset = next((a for a in release.get("assets", [])
                            if a.get("name") == filename and a.get("state") == "uploaded"), None)
              if release.get("draft") is not False or not asset:
                  raise ValueError("ملف IPA غير موجود في إصدار عام منشور.")
              size = asset["size"]
              if type(size) is not int or not 0 < size < 2**31:
                  raise ValueError("حجم IPA خارج الحد المسموح.")
              with TemporaryDirectory() as folder:
                  path = Path(folder) / "update.ipa"
                  subprocess.run(["curl", "--fail", "--silent", "--show-error", "--location",
                                  "--proto", "=https", "--proto-redir", "=https", "--connect-timeout", "15",
                                  "--max-time", "420", "--max-filesize", str(size), "--output", str(path), link],
                                 capture_output=True, check=True, timeout=450)
                  with path.open("rb") as stream:
                      digest = hashlib.file_digest(stream, "sha256").hexdigest()
                  if path.stat().st_size != size or (asset.get("digest") and asset["digest"] != "sha256:" + digest):
                      raise ValueError("حجم الملف أو بصمته يختلفان عن الأصل المنشور في GitHub.")
                  report.update(inspect(path, bundle, build), sha256=digest)
          except ValueError as error:
              report["error"] = str(error)
          except Exception:
              report["error"] = "تعذّر تنزيل ملف IPA من GitHub أو قراءة بياناته."

          payload = base64.b64encode(json.dumps(report, ensure_ascii=False).encode()).decode()
          gh("api", "--method", "PUT", f"repos/{REPO}/contents/.xsign-inspect/{request}.json",
             "--input", "-", data=json.dumps({"branch": "main", "message": "Record XSign IPA inspection [skip ci]",
                                               "content": payload}))
          if report.get("error"):
              raise SystemExit(report["error"])
          PY
